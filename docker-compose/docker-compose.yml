services:
  pgassistant:
    image: bertrand73/pgassistant:latest
    restart: always
    environment:
      - OPENAI_API_KEY=nothing
      - OPENAI_API_MODEL=gpt-oss:20b 
      - LOCAL_LLM_URI=http://host.docker.internal:11434/v1/
      - LLM_SQL_GUIDELINES=https://raw.githubusercontent.com/beh74/pgassistant-blog/refs/heads/main/content/post/sql-guide.md
      - SECRET_KEY=mySecretKeyforPGAssistant
      # if you are using pgassistant collector, you can use the following environment variable to connect to it
      - COLLECTOR_URI=postgresql://pga_collector:pga_collector@host.docker.internal:5433/pga_collector
    ports:
      - "8080:5005"
    volumes:
      - ./myqueries.json:/home/pgassistant/myqueries.json

# tips
# with ollama, you should test the gpt-oss and codestral model giving good results
# if you run ollama localy, don't forget to export this environment variable : OLLAMA_HOST=0.0.0.0:11434 and then run ollama serve
